# cargo-deny configuration for rdownloader
# Checks licenses, bans, advisories, and sources.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # `rsa` (Marvin attack, no fixed version exists): pulled in by Arti's key handling and the SSH library.
    # The attack needs an attacker who can observe many private-key operations over the network; a download client
    # does not offer such an oracle. Revisit when RustCrypto publishes a constant-time implementation.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "bzip2-1.0.6",     # bzip2 (zip crate)
    "MPL-2.0",        # option-ext (unmodified, linked as a library)
    "OFL-1.1",        # fonts embedded by egui
    "Ubuntu-font-1.0",# fonts embedded by egui
    "CDLA-Permissive-2.0", # Mozilla root certificates (webpki-roots)
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
