[package]
name = "rdownloader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room Rust download manager with Tor (Arti), multi-part downloads, plugin system and TUI - inspired by JDownloader, no code taken."

[dependencies]
# Tor (official Rust implementation of the Tor project)
arti-client = { version = "0.46", features = ["tokio", "bridge-client"] }
tor-rtcompat = "0.46"
# Only the features the app actually uses (no process/signal/io-std).
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

# Async streams and buffers
futures = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

# HTTP/1.1 over the Arti stream + TLS (net-1)
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# Serialization / config / tracking
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# TUI (JDownloader-like interface in the terminal)
ratatui = "0.28"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Utils
anyhow = "1"
# Error types of the plugin permission model (src/plugin/permissions.rs).
thiserror = "1"
# Sandboxed WebAssembly plugin runtime (plugins-7).
wasmi = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Checksums (verification of finished downloads)
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[test]]
name = "integration_kill_resume_hash"
path = "tests/integration_kill_resume_hash.rs"
